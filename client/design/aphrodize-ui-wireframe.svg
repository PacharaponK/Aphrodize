  <text x="1050" y="130" class="h">2. วิเคราะห์ภาพใหม่</text><rect x="1050" y="150" width="496" height="425" rx="18" class="panel"/><text x="1081" y="195" class="title" style="font-size:22px">ถ่ายภาพให้เทียบกันได้</text><text x="1081" y="222" class="s">ใช้หน้าสด หน้าตรง และแสงกระจาย</text><rect x="1081" y="248" width="434" height="168" rx="13" fill="#f5f3ff" stroke="#bdb2ef" stroke-width="2" stroke-dasharray="8 7"/><circle cx="1298" cy="318" r="48" fill="#e5e7eb"/><path d="M1275 306 Q1298 283 1321 306 M1280 345 Q1298 359 1316 345" fill="none" stroke="#94a3b8" stroke-width="3"/><text x="1197" y="391" class="h">อัปโหลดภาพ หรือเปิดกล้อง</text><rect x="1172" y="439" width="255" height="43" rx="10" class="accent"/><text x="1213" y="466" class="white" style="font-weight:bold">เลือกภาพ</text><text x="1081" y="521" class="s">ก่อนส่ง ระบบจะแสดง consent และตรวจคุณภาพภาพ</text>
  <text x="1050" y="624" class="h">3. คำแนะนำที่ผ่าน safety check</text><rect x="1050" y="644" width="496" height="386" rx="18" class="panel"/><rect x="1081" y="676" width="120" height="27" rx="14" class="mint"/><text x="1094" y="694" class="tag">ข้อมูลประกอบ</text><text x="1081" y="742" class="h">ดูแลเกราะป้องกันผิวและป้องกันแดด</text><text x="1081" y="770" class="t">หมวดผลิตภัณฑ์: moisturizer + broad-spectrum sunscreen SPF 30+</text><line x1="1081" y1="797" x2="1515" y2="797" class="grid"/><text x="1081" y="827" class="h" style="font-size:14px">เหตุผลและแหล่งข้อมูล</text><text x="1081" y="852" class="t">ผลภาพ: periocular wrinkle score ผ่าน confidence threshold</text><text x="1081" y="876" class="t">ผู้ใช้รายงาน: ผิวแห้ง, UV exposure สูง, ใช้ sunscreen ไม่สม่ำเสมอ</text><text x="1081" y="909" class="s">Rule R-UV-001 · version 1.0 · ไม่ยืนยันว่า UV เป็นสาเหตุ</text><rect x="1081" y="939" width="434" height="55" rx="10" class="warn"/><text x="1100" y="962" class="h" style="font-size:13px">หากมีอาการรุนแรงหรือระคายเคือง</text><text x="1100" y="981" class="s">หยุดใช้และปรึกษาผู้เชี่ยวชาญ ระบบจะไม่แสดงคำแนะนำที่ไม่ปลอดภัย</text>
