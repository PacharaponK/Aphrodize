  <rect x="595" y="1120" width="410" height="590" rx="30" class="panel"/><rect x="595" y="1120" width="410" height="48" rx="30" fill="#14263d"/><text x="619" y="1151" class="white" style="font-weight:bold">ตรวจคุณภาพภาพ</text><circle cx="800" cy="1260" r="42" fill="#fff0dc"/><text x="785" y="1273" style="font:700 33px Arial;fill:#b45309">!</text><text x="637" y="1341" class="title" style="font-size:22px">ภาพนี้ยังใช้เปรียบเทียบไม่ได้</text><text x="637" y="1368" class="s">จึงไม่นำไปคำนวณผลหรือแนวโน้ม</text><rect x="637" y="1401" width="326" height="42" rx="9" class="warn"/><text x="654" y="1427" class="t">แสงน้อยเกินไป</text><rect x="637" y="1454" width="326" height="42" rx="9" class="warn"/><text x="654" y="1480" class="t">ภาพอาจเบลอ</text><text x="637" y="1534" class="h" style="font-size:14px">ลองใหม่แบบนี้</text><text x="637" y="1560" class="t">• หันหน้าเข้าหาแสงที่นุ่มและสม่ำเสมอ</text><text x="637" y="1585" class="t">• วางกล้องนิ่ง และให้ใบหน้าอยู่กลางภาพ</text><rect x="637" y="1622" width="326" height="48" rx="10" class="accent"/><text x="744" y="1653" class="white" style="font-weight:bold">ถ่ายภาพใหม่</text>
