  <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d9e1ea;stroke-width:2}.nav{fill:#14263d}.accent{fill:#7963d4}.soft{fill:#f0edff}.mint{fill:#e7f8f2}.warn{fill:#fff5df}.muted{fill:#64748b}.dark{fill:#172033}.title{font:700 25px Arial,sans-serif;fill:#172033}.h{font:700 16px Arial,sans-serif;fill:#172033}.t{font:14px Arial,sans-serif;fill:#334155}.s{font:12px Arial,sans-serif;fill:#64748b}.white{font:14px Arial,sans-serif;fill:#fff}.score{font:700 44px Arial,sans-serif;fill:#7963d4}.line{stroke:#7963d4;stroke-width:4;fill:none}.grid{stroke:#e2e8f0;stroke-width:1}.pill{fill:#e7f8f2}.tag{font:700 11px Arial,sans-serif;fill:#16745e}</style>
