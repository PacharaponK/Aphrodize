<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d9e1ea;stroke-width:2}.nav{fill:#14263d}.accent{fill:#7963d4}.soft{fill:#f0edff}.mint{fill:#e7f8f2}.warn{fill:#fff5df}.muted{fill:#64748b}.dark{fill:#172033}.title{font:700 25px Arial,sans-serif;fill:#172033}.h{font:700 16px Arial,sans-serif;fill:#172033}.t{font:14px Arial,sans-serif;fill:#334155}.s{font:12px Arial,sans-serif;fill:#64748b}.white{font:14px Arial,sans-serif;fill:#fff}.score{font:700 44px Arial,sans-serif;fill:#7963d4}.line{stroke:#7963d4;stroke-width:4;fill:none}.grid{stroke:#e2e8f0;stroke-width:1}.pill{fill:#e7f8f2}.tag{font:700 11px Arial,sans-serif;fill:#16745e}</style>
  <rect class="bg" width="1600" height="1120"/><text x="54" y="54" class="title">Aphrodize · Front-end wireframe</text><text x="54" y="80" class="s">Wellness skin tracking · ไม่ใช่การวินิจฉัยโรค</text>
  <text x="54" y="130" class="h">1. Dashboard / ผลวิเคราะห์ล่าสุด</text><rect x="54" y="150" width="950" height="880" rx="18" class="panel"/><rect x="54" y="150" width="205" height="880" rx="18" class="nav"/>
  <text x="82" y="198" class="white" style="font-weight:bold;font-size:21px">aphrodize</text><text x="82" y="245" class="white">⌂  ภาพรวม</text><text x="82" y="286" class="white">＋  วิเคราะห์ภาพ</text><text x="82" y="327" class="white">⌁  แนวโน้ม</text><text x="82" y="368" class="white">☷  Skin profile</text><line x1="82" y1="408" x2="232" y2="408" stroke="#526174"/><text x="82" y="445" class="white">⚙  การตั้งค่า</text><text x="82" y="485" class="white">⌫  ลบข้อมูล</text><rect x="82" y="930" width="148" height="54" rx="10" fill="#263b54"/><text x="95" y="953" class="white" style="font-size:12px">ข้อมูลของคุณ</text><text x="95" y="972" class="white" style="font-size:11px">เก็บตาม consent</text>
  <text x="292" y="200" class="title">สวัสดี, Ink</text><text x="292" y="226" class="s">ผลล่าสุด · 20 ก.ย. 2026 · ภาพผ่าน quality gate</text><rect x="292" y="254" width="677" height="57" rx="10" class="warn"/><text x="313" y="280" class="h" style="font-size:14px">โปรดอ่านก่อนตีความผล</text><text x="313" y="300" class="s">ผลเป็นข้อมูลเพื่อการติดตาม ไม่ใช่การวินิจฉัยหรือยืนยันสาเหตุ</text>
  <rect x="292" y="337" width="208" height="177" rx="14" class="panel"/><text x="315" y="367" class="s">WRINKLE SCORE</text><text x="315" y="417" class="score">37</text><text x="391" y="410" class="h">/ 100</text><text x="315" y="448" class="t">ระดับ: ปานกลาง</text><text x="315" y="481" class="s">Model v0.1 · confidence 0.86</text>
  <rect x="520" y="337" width="210" height="177" rx="14" class="panel"/><text x="543" y="367" class="s">ลักษณะคล้ายสิว</text><text x="543" y="417" class="score">8</text><text x="585" y="410" class="h">จุด</text><text x="543" y="448" class="t">confidence 0.84</text><text x="543" y="481" class="s">ตรวจพบจากภาพ</text>
  <rect x="750" y="337" width="219" height="177" rx="14" class="panel"/><text x="773" y="367" class="s">คุณภาพภาพ</text><rect x="773" y="388" width="75" height="25" rx="12" class="pill"/><text x="786" y="405" class="tag">ผ่าน</text><text x="773" y="447" class="t">แสง · มุม · ความคม</text><text x="773" y="481" class="s">ใช้ในแนวโน้มได้</text>
  <rect x="292" y="540" width="405" height="229" rx="14" class="panel"/><text x="315" y="572" class="h">ตรวจพบจากภาพ</text><text x="315" y="597" class="s">แสดงเฉพาะสัญญาณจากโมเดล</text><circle cx="355" cy="675" r="58" fill="#eef2f7" stroke="#cbd5e1"/><path d="M330 655 Q355 632 380 655 M336 702 Q355 716 374 702" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M320 650 l20 8 M370 658 l20 -8" stroke="#7963d4" stroke-width="3"/><text x="438" y="649" class="t">รอบดวงตา</text><text x="438" y="674" class="h">ปานกลาง · 0.86</text><text x="438" y="712" class="t">หน้าผาก</text><text x="438" y="737" class="h">เล็กน้อย · 0.79</text>
  <rect x="717" y="540" width="252" height="229" rx="14" class="panel"/><text x="740" y="572" class="h">คุณรายงาน</text><text x="740" y="597" class="s">ไม่ใช่ผลตรวจจากภาพ</text><rect x="740" y="620" width="97" height="29" rx="14" class="soft"/><text x="753" y="639" class="t">ผิวแห้ง</text><rect x="846" y="620" width="99" height="29" rx="14" class="soft"/><text x="858" y="639" class="t">ระคายง่าย</text><text x="740" y="683" class="t">UV exposure: สูง</text><text x="740" y="711" class="t">Sunscreen: ไม่สม่ำเสมอ</text><text x="740" y="747" class="s">แก้ไขข้อมูล →</text>
  <rect x="292" y="793" width="677" height="200" rx="14" class="panel"/><text x="315" y="827" class="h">แนวโน้ม 12 สัปดาห์</text><text x="315" y="851" class="s">ใช้เฉพาะภาพที่ผ่าน capture protocol และ quality gate</text><line x1="330" y1="937" x2="930" y2="937" class="grid"/><line x1="330" y1="895" x2="930" y2="895" class="grid"/><path d="M350 920 L430 900 L510 907 L590 885 L670 891 L750 874 L830 881 L910 860" class="line"/><text x="340" y="970" class="s">Jun</text><text x="500" y="970" class="s">Jul</text><text x="660" y="970" class="s">Aug</text><text x="820" y="970" class="s">Sep</text>
  <text x="1050" y="130" class="h">2. วิเคราะห์ภาพใหม่</text><rect x="1050" y="150" width="496" height="425" rx="18" class="panel"/><text x="1081" y="195" class="title" style="font-size:22px">ถ่ายภาพให้เทียบกันได้</text><text x="1081" y="222" class="s">ใช้หน้าสด หน้าตรง และแสงกระจาย</text><rect x="1081" y="248" width="434" height="168" rx="13" fill="#f5f3ff" stroke="#bdb2ef" stroke-width="2" stroke-dasharray="8 7"/><circle cx="1298" cy="318" r="48" fill="#e5e7eb"/><path d="M1275 306 Q1298 283 1321 306 M1280 345 Q1298 359 1316 345" fill="none" stroke="#94a3b8" stroke-width="3"/><text x="1197" y="391" class="h">อัปโหลดภาพ หรือเปิดกล้อง</text><rect x="1172" y="439" width="255" height="43" rx="10" class="accent"/><text x="1213" y="466" class="white" style="font-weight:bold">เลือกภาพ</text><text x="1081" y="521" class="s">ก่อนส่ง ระบบจะแสดง consent และตรวจคุณภาพภาพ</text>
  <text x="1050" y="624" class="h">3. คำแนะนำที่ผ่าน safety check</text><rect x="1050" y="644" width="496" height="386" rx="18" class="panel"/><rect x="1081" y="676" width="120" height="27" rx="14" class="mint"/><text x="1094" y="694" class="tag">ข้อมูลประกอบ</text><text x="1081" y="742" class="h">ดูแลเกราะป้องกันผิวและป้องกันแดด</text><text x="1081" y="770" class="t">หมวดผลิตภัณฑ์: moisturizer + broad-spectrum sunscreen SPF 30+</text><line x1="1081" y1="797" x2="1515" y2="797" class="grid"/><text x="1081" y="827" class="h" style="font-size:14px">เหตุผลและแหล่งข้อมูล</text><text x="1081" y="852" class="t">ผลภาพ: periocular wrinkle score ผ่าน confidence threshold</text><text x="1081" y="876" class="t">ผู้ใช้รายงาน: ผิวแห้ง, UV exposure สูง, ใช้ sunscreen ไม่สม่ำเสมอ</text><text x="1081" y="909" class="s">Rule R-UV-001 · version 1.0 · ไม่ยืนยันว่า UV เป็นสาเหตุ</text><rect x="1081" y="939" width="434" height="55" rx="10" class="warn"/><text x="1100" y="962" class="h" style="font-size:13px">หากมีอาการรุนแรงหรือระคายเคือง</text><text x="1100" y="981" class="s">หยุดใช้และปรึกษาผู้เชี่ยวชาญ ระบบจะไม่แสดงคำแนะนำที่ไม่ปลอดภัย</text>
</svg>
