name: aphrodize

# The API accepts uploads; Redis hands image and training jobs to separate workers.
x-api-environment: &api-environment
  APP_ENV: development
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-aphrodize}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-aphrodize}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-aphrodize}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
  MINIO_SECURE: "false"
  MINIO_BUCKET: aphrodize-private
  LABEL_STUDIO_URL: http://label-studio:8080
  LABEL_STUDIO_API_KEY: ${LABEL_STUDIO_API_KEY:-}
  LABEL_STUDIO_PROJECT_ID: ${LABEL_STUDIO_PROJECT_ID:-0}
  API_USERNAME: ${API_USERNAME:-aphrodize}
  API_PASSWORD: ${API_PASSWORD:?Set API_PASSWORD in .env}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret-in-production}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODEL_VERSION: ${MODEL_VERSION:-ffhq-wrinkle-stage2-unet}
  APHRODIZE_WRINKLE_APPROVED_MANIFEST: ${APHRODIZE_WRINKLE_APPROVED_MANIFEST:-}
  APHRODIZE_WRINKLE_REVIEWED_POLICY: ${APHRODIZE_WRINKLE_REVIEWED_POLICY:-}
  APHRODIZE_WRINKLE_POLICY_BUNDLE: ${APHRODIZE_WRINKLE_POLICY_BUNDLE:-}

x-container-logging: &container-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL stores consent, analysis, annotation, and run metadata.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aphrodize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aphrodize
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aphrodize -d aphrodize"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *container-logging

  # Redis carries IDs for asynchronous inference and training jobs.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *container-logging

  # MinIO keeps uploaded and derived image bytes out of PostgreSQL.
  minio:
    profiles: [ai]
    image: aphrodize-minio:RELEASE.2025-09-07T16-13-09Z
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-aphrodize}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *container-logging

  # Initialize the private, annotation, and MLflow buckets once per stack.
  minio-init:
    profiles: [ai]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: python -m backend.scripts.init_buckets
    environment: *api-environment
    depends_on:
      minio:
        condition: service_healthy
    logging: *container-logging

  # Human reviewers draw wrinkle masks in a separate Label Studio project.
  label-studio:
    profiles: [ai]
    image: heartexlabs/label-studio:latest
    environment:
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "false"
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-aphrodize@example.local}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:?Set LABEL_STUDIO_PASSWORD in .env}
    volumes:
      - label_studio_data:/label-studio/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/user/login/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *container-logging

  # MLflow records experiments in PostgreSQL and checkpoints in MinIO.
  mlflow:
    profiles: [ai]
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
      additional_contexts:
        api_image: service:api
    command: ["/app/start.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-aphrodize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-aphrodize}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *container-logging

  fixture:
    profiles: [demo]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: python -m backend.scripts.load_fixtures /app/backend/fixtures/users.yaml
    environment: *api-environment
    volumes:
      - ./backend/fixtures:/app/backend/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *container-logging

  # FastAPI validates requests and queues jobs without running the model inline.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *api-environment
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./backend:/app/backend
      - ./models:/app/models
      - ./scripts:/app/scripts:ro
      - ./storage/artifacts/uv:/app/storage/artifacts/uv:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *container-logging

  # Build two-day UV snapshots from locally trained models and public raw data.
  uv-refresh:
    profiles: [background]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["sh", "-c", "while true; do if python /app/scripts/refresh_uv_forecast.py; then sleep 21600; else sleep 1800; fi; done"]
    restart: unless-stopped
    environment:
      <<: *api-environment
      PYTHONPATH: /app
    volumes:
      - ./backend:/app/backend:ro
      - ./scripts:/app/scripts:ro
      - ./storage/data/uv:/app/storage/data/uv
      - ./storage/models/uv:/app/storage/models/uv
      - ./storage/artifacts/uv:/app/storage/artifacts/uv
    logging: *container-logging

  # Optional monthly candidate training. Approval remains an explicit operator command.
  uv-training:
    profiles: [uv-training]
    image: aphrodize-uv-refresh
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["sh", "-c", "while true; do if python /app/scripts/uv_mlops.py pipeline; then sleep 2592000; else sleep 86400; fi; done"]
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: ${UV_MLFLOW_TRACKING_URI:-file:///app/storage/artifacts/uv/mlruns}
    volumes:
      - ./backend:/app/backend:ro
      - ./scripts:/app/scripts:ro
      - ./storage/data/uv:/app/storage/data/uv
      - ./storage/models/uv:/app/storage/models/uv
      - ./storage/artifacts/uv:/app/storage/artifacts/uv
    logging: *container-logging

  # The inference worker analyzes images and publishes consented review tasks.
  inference-worker:
    profiles: [ai]
    build:
      context: .
      dockerfile: docker/inference.Dockerfile
    command: arq backend.workers.inference_worker.WorkerSettings
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - ./backend:/app/backend:ro
      - ./ai:/app/ai:ro
      - ./storage/models/ffhq-wrinkle:/app/storage/models/ffhq-wrinkle:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    logging: *container-logging

  # The trainer consumes approved external datasets and logs candidate models.
  trainer-worker:
    profiles: [ai]
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
    command: arq backend.workers.trainer_worker.WorkerSettings
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - ./models:/app/models
      - ./storage/data/approved:/app/storage/data/approved:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    logging: *container-logging

volumes:
  postgres_data:
  redis_data:
  minio_data:
  label_studio_data:
