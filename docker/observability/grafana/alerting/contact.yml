apiVersion: 1
contactPoints:
  - orgId: 1
    name: operations
    receivers:
      - uid: operations-discord
        type: discord
        disableResolveMessage: false
        settings:
          url: $DISCORD_WEBHOOK_URL
policies:
  - orgId: 1
    receiver: operations
    group_by: [grafana_folder, alertname, queue, dependency]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
