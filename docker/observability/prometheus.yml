global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: api
    metrics_path: /api/v1/monitoring/metrics
    basic_auth:
      username: aphrodize
      password_file: /run/secrets/api-password
    static_configs:
      - targets: [api:8000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
  - job_name: optional-workers
    file_sd_configs:
      - files: [/etc/prometheus/targets/workers.json]
  - job_name: optional-gpu
    file_sd_configs:
      - files: [/etc/prometheus/targets/gpu.json]
  - job_name: optional-caddy
    file_sd_configs:
      - files: [/etc/prometheus/targets/caddy.json]
  - job_name: probe
    metrics_path: /probe
    params: {module: [http_2xx]}
    file_sd_configs:
      - files: [/etc/prometheus/targets/probes.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
