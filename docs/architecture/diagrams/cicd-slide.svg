  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="92" font-size="44" font-weight="700" fill="#212529">Deployment: CI/CD and Rollback</text>
  <text x="60" y="136" font-size="22" fill="#6C757D">Merge to main triggers automatic build and deploy; failures roll back by themselves</text>

  <!-- Zone: GitHub -->
  <rect x="60" y="250" width="1090" height="360" rx="24" fill="#F6F8FB" stroke="#D5DCE5" stroke-width="2"/>
  <use href="#i-github" x="90" y="272" width="28" height="28" fill="#212529"/>
  <text x="130" y="295" font-size="23" font-weight="700" fill="#212529">GitHub</text>
  <text x="215" y="295" font-size="21" fill="#6C757D">· test, build, publish</text>

  <!-- Zone: VM -->
  <rect x="1270" y="250" width="590" height="360" rx="24" fill="#EFFBF9" stroke="#A7E3DB" stroke-width="2"/>
  <use href="#i-linux" x="1300" y="271" width="28" height="28" fill="#212529"/>
  <text x="1340" y="295" font-size="23" font-weight="700" fill="#212529">VM</text>
  <text x="1384" y="295" font-size="21" fill="#6C757D">· self-hosted runner, deploy</text>

  <!-- Pipeline arrows -->
  <g stroke="#212529" stroke-width="3.5" marker-end="url(#ah)">
    <line x1="310" y1="450" x2="358" y2="450"/>
    <line x1="580" y1="450" x2="628" y2="450"/>
    <line x1="850" y1="450" x2="898" y2="450"/>
    <line x1="1120" y1="450" x2="1298" y2="450"/>
    <line x1="1520" y1="450" x2="1608" y2="450"/>
  </g>
  <text x="1210" y="436" text-anchor="middle" font-size="17" fill="#6C757D">pull</text>
  <text x="1210" y="478" text-anchor="middle" font-size="15" font-family="Consolas, monospace" fill="#C2416E">image@sha256</text>

  <!-- 1 merge to main -->
  <rect x="90" y="350" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#78869A" stroke-width="4"/>
  <use href="#i-git" x="174" y="378" width="52" height="52" fill="#F05032"/>
  <text x="200" y="480" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">merge to main</text>
  <text x="200" y="514" text-anchor="middle" font-size="19" fill="#6C757D">branch protection</text>

  <!-- 2 CI -->
  <rect x="360" y="350" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/>
  <use href="#i-githubactions" x="444" y="378" width="52" height="52" fill="#2088FF"/>
  <text x="470" y="480" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">CI</text>
  <text x="470" y="514" text-anchor="middle" font-size="19" fill="#6C757D">Backend, Frontend</text>

  <!-- 3 Build image -->
  <rect x="630" y="350" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
  <use href="#i-docker" x="714" y="378" width="52" height="52" fill="#2496ED"/>
  <text x="740" y="480" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">Build image</text>
  <text x="740" y="514" text-anchor="middle" font-size="19" fill="#6C757D">API, Web, MinIO</text>

  <!-- 4 GHCR -->
  <rect x="900" y="350" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
  <use href="#i-github" x="984" y="378" width="52" height="52" fill="#181717"/>
  <text x="1010" y="480" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">GHCR</text>
  <text x="1010" y="514" text-anchor="middle" font-size="19" fill="#6C757D">manifest + digest</text>

  <!-- 5 Runner on VM -->
  <rect x="1300" y="350" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="4"/>
  <use href="#i-linux" x="1384" y="378" width="52" height="52" fill="#212529"/>
  <text x="1410" y="480" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">Runner on VM</text>
  <text x="1410" y="514" text-anchor="middle" font-size="19" fill="#6C757D">update API/Web</text>

  <!-- 6 Health check -->
  <rect x="1610" y="350" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/>
  <circle cx="1720" cy="404" r="27" fill="#16A34A"/>
  <path d="M1708 404 l9 9 l16 -18" fill="none" stroke="#FFFFFF" stroke-width="4.9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1720" y="480" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">Health check</text>
  <text x="1720" y="514" text-anchor="middle" font-size="19" fill="#6C757D">health, HTTPS</text>

  <!-- Step badges -->
  <g font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="94" cy="354" r="21" fill="#C2416E" stroke="#FFFFFF" stroke-width="3"/><text x="94" y="361">1</text>
    <circle cx="364" cy="354" r="21" fill="#C2416E" stroke="#FFFFFF" stroke-width="3"/><text x="364" y="361">2</text>
    <circle cx="634" cy="354" r="21" fill="#C2416E" stroke="#FFFFFF" stroke-width="3"/><text x="634" y="361">3</text>
    <circle cx="904" cy="354" r="21" fill="#C2416E" stroke="#FFFFFF" stroke-width="3"/><text x="904" y="361">4</text>
    <circle cx="1304" cy="354" r="21" fill="#C2416E" stroke="#FFFFFF" stroke-width="3"/><text x="1304" y="361">5</text>
    <circle cx="1614" cy="354" r="21" fill="#C2416E" stroke="#FFFFFF" stroke-width="3"/><text x="1614" y="361">6</text>
  </g>

  <!-- CI fails: release blocked -->
  <line x1="470" y1="550" x2="470" y2="768" stroke="#DC2626" stroke-width="5" marker-end="url(#ahr)"/>
