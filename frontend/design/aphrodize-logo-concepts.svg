<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610">
  <style>.bg{fill:#f7f8fc}.card{fill:#fff;stroke:#dce3ec;stroke-width:2}.h{font:700 25px Arial,sans-serif;fill:#162033}.t{font:15px Arial,sans-serif;fill:#64748b}.name{font:700 30px Arial,sans-serif;fill:#162033}.sub{font:14px Arial,sans-serif;fill:#64748b}.a{font:700 13px Arial,sans-serif;fill:#7059cf}</style>
  <rect class="bg" width="1440" height="610"/><text x="70" y="71" class="h">Aphrodize · Logo directions</text><text x="70" y="99" class="t">Wellness tracking, neutral and privacy-conscious — no age, beauty-score, or diagnosis visual cues</text>
