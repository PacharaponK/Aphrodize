  <rect x="70" y="140" width="395" height="390" rx="25" class="card"/><text x="103" y="184" class="a">01 · RECOMMENDED</text><rect x="103" y="216" width="86" height="86" rx="25" fill="#7059cf"/><path d="M124 272 C124 238 168 229 168 246 C168 263 147 259 147 279 M137 280 C144 257 174 260 174 280" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="166" cy="268" r="4" fill="#c4b8ff"/><text x="211" y="255" class="name">aphrodize</text><text x="211" y="280" class="sub">skin tracking, gently</text><text x="103" y="349" class="h" style="font-size:18px">Contour A</text><text x="103" y="379" class="t">ตัวอักษร A แบบเส้นโค้งซ้อน</text><text x="103" y="402" class="t">สื่อถึงการติดตามเป็นชั้น ๆ และ</text><text x="103" y="425" class="t">visual signal โดยไม่สื่อถึงริ้วรอยตรง ๆ</text><text x="103" y="477" class="sub">เหมาะกับ: app icon, favicon, dashboard</text>
